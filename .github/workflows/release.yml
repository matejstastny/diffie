name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          build-essential curl file libayatana-appindicator3-dev libgtk-3-dev
          libssl-dev libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Publish Linux bundles
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Diffie ${{ github.ref_name }}
          releaseBody: See the assets below to download this release.
          releaseDraft: true
          prerelease: false
          args: --bundles appimage,deb
